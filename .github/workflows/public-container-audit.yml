name: Verify the public MARTO container
on:
  pull_request:
    branches: [main]
permissions: {}
jobs:
  public-container:
    if: github.event.pull_request.head.ref == 'bonus/ci-gate'
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run the public 1.0.0 image without signing in
        run: |
          export DOCKER_CONFIG="$(mktemp -d)"
          image=ghcr.io/a-h-feizi/dry-shop:1.0.0
          docker pull "$image"
          docker image inspect "$image" --format '{{json .RepoDigests}}'
          docker run -d -p 8080:80 --name dry-shop-public "$image"
          trap 'docker logs dry-shop-public; docker rm -f dry-shop-public' EXIT
          curl --fail --silent --show-error --retry 5 --retry-all-errors --max-time 5 http://127.0.0.1:8080/ -o /tmp/marto-public-index.html
          grep -q 'id="root"' /tmp/marto-public-index.html
          curl --fail --silent --show-error --retry 3 http://127.0.0.1:8080/api/products.json | jq -e 'type == "array" and length > 0' > /dev/null
          echo 'Public 1.0.0 image started and served the storefront and catalogue API.'
